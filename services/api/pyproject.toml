[project]
name = "trans-typesetting-api"
version = "0.1.0"
description = "FastAPI service for local PDF translation and typesetting."
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.111",
  "httpx>=0.27",
  "jinja2>=3.1",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pdf-translator-renderer",
  "pdf-translator-schema",
  "pymupdf>=1.24",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30"
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
