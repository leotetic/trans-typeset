[tool.pytest.ini_options]
testpaths = [
  "packages/schema/tests",
  "packages/renderer/tests",
  "services/api/tests"
]
pythonpath = [
  "packages/schema",
  "packages/renderer",
  "services/api"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

